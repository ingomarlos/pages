<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>DE-JA Phrase SRS</title>
<style>
  :root { --bg:#0b0b0c; --fg:#f7f7fa; --muted:#9aa0a6; --acc:#4c8bf5; --surface:#151821; --surface-hi:#1f2330; }
  * { box-sizing:border-box; }
  body { font-family:system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
         background:var(--bg); color:var(--fg); margin:0; min-height:100vh;
         display:flex; justify-content:center; }
  .app { width:min(760px,100%); padding:clamp(18px,4vw,32px); display:flex; flex-direction:column; gap:20px; }
  h1 { margin:0; text-align:center; font-size:clamp(1.6rem,5vw,2.4rem); }
  .panel { background:var(--surface); border:1px solid rgba(255,255,255,0.08); border-radius:8px;
           padding:clamp(16px,4vw,26px); box-shadow:0 18px 40px rgba(0,0,0,0.45); display:flex; flex-direction:column; gap:14px; }
  label { font-weight:600; font-size:0.95rem; }
  select, input, button { width:100%; border-radius:8px; border:1px solid rgba(255,255,255,0.08);
                          padding:10px 14px; font-size:1rem; background:var(--surface-hi); color:var(--fg); }
  button.primary { background:linear-gradient(135deg,rgba(76,139,245,0.93),rgba(90,160,255,0.88)); border:none;
                   box-shadow:0 12px 28px rgba(76,139,245,0.35); font-weight:600; cursor:pointer; }
  button.secondary { background:rgba(24,28,40,0.9); font-weight:600; cursor:pointer; }
  button:disabled { opacity:0.5; cursor:not-allowed; }
  .phrase { min-height:260px; display:flex; flex-direction:column; align-items:center; justify-content:center;
            text-align:center; gap:18px; padding:30px; border-radius:8px; background:linear-gradient(160deg,#191d29,#10121a);
            box-shadow:0 20px 45px rgba(0,0,0,0.5); }
  .de { font-size:clamp(1.45rem,5vw,2rem); font-weight:700; line-height:1.25; }
  .ja { font-size:clamp(1.35rem,5vw,1.9rem); font-weight:700; line-height:1.35; color:#d8e6ff; }
  .placeholder { color:var(--muted); }
  .meta { font-size:0.95rem; color:var(--muted); text-align:center; line-height:1.45; }
  .controls { display:grid; grid-template-columns:repeat(auto-fit,minmax(160px,1fr)); gap:12px; }
  .hidden { display:none; }
</style>
</head>
<body>
<div class="app">
  <h1>DE-JA Phrase SRS</h1>

  <section class="panel">
    <div class="controls">
      <div>
        <label>Block</label>
        <select id="blockSelect"></select>
      </div>
      <div>
        <label>German repeats</label>
        <select id="deRepeat">
          <option value="1" selected>1x</option>
          <option value="2">2x</option>
          <option value="3">3x</option>
        </select>
      </div>
      <div>
        <label>Japanese repeats</label>
        <select id="jaRepeat">
          <option value="1">1x</option>
          <option value="2">2x</option>
          <option value="3" selected>3x</option>
        </select>
      </div>
      <div>
        <label>Think time (sec)</label>
        <input id="thinkDelay" type="number" min="1" max="30" value="8"/>
      </div>
      <div>
        <label>Next phrase after (sec)</label>
        <input id="nextDelay" type="number" min="1" max="30" value="5"/>
      </div>
      <div>
        <label>Voice (German)</label>
        <select id="deVoice" disabled></select>
      </div>
      <div>
        <label>Voice (Japanese)</label>
        <select id="jaVoice" disabled></select>
      </div>
    </div>
    <label><input type="checkbox" id="autoMode" checked/> Auto mode</label>
    <p style="font-size:0.9rem;color:var(--muted);margin:0;">Pick a 20-phrase block. The session plays in a fixed review order with no saved data.</p>
  </section>

  <section>
    <div class="meta" id="meta">Press Start.</div>
    <div class="phrase">
      <div class="de" id="deText">Waiting...</div>
      <div class="ja hidden" id="jaText"></div>
    </div>
  </section>

  <section class="panel">
    <div class="controls">
      <button id="startBtn" class="primary">Start</button>
      <button id="pauseBtn" class="secondary" disabled>Pause</button>
      <button id="prevBtn" class="secondary" disabled>Previous step</button>
      <button id="nextBtn" class="secondary" disabled>Next step</button>
      <button id="replayBtn" class="secondary" disabled>Replay current</button>
    </div>
  </section>
</div>

const blockSelect = document.getElementById("blockSelect");
const deRepeatSel = document.getElementById("deRepeat");
const jaRepeatSel = document.getElementById("jaRepeat");
const thinkDelayInput = document.getElementById("thinkDelay");
const nextDelayInput = document.getElementById("nextDelay");
const deVoiceSel = document.getElementById("deVoice");
const jaVoiceSel = document.getElementById("jaVoice");
const autoModeChk = document.getElementById("autoMode");
const metaEl = document.getElementById("meta");
const deTextEl = document.getElementById("deText");
const jaTextEl = document.getElementById("jaText");
const startBtn = document.getElementById("startBtn");
const pauseBtn = document.getElementById("pauseBtn");
const prevBtn = document.getElementById("prevBtn");
const nextBtn = document.getElementById("nextBtn");
const replayBtn = document.getElementById("replayBtn");

let voices = [];
let blockPhrases = [];
let schedule = [];
let stepIndex = 0;
let showingJapanese = false;
let paused = false;
let timer = null;
let speechToken = 0;

const GENERAL_VOICE_PREFERENCE = [/google/i];
const LANGUAGE_VOICE_PREFERENCE = {
  de: [/microsoft\s+ingrid/i],
  ja: [/kyoko/i, /nanami/i, /google/i]
};

function clampNumber(value, min, max, fallback) {
  const parsed = Number(value);
  if (!Number.isFinite(parsed)) return fallback;
  return Math.min(max, Math.max(min, parsed));
}

function populateBlocks() {
  blockSelect.innerHTML = "";
  const blockCount = Math.ceil(PRELOADED_PHRASES.length / 20);
  for (let i = 0; i < blockCount; i += 1) {
    const start = i * 20 + 1;
    const end = Math.min((i + 1) * 20, PRELOADED_PHRASES.length);
    const opt = document.createElement("option");
    opt.value = String(i);
    opt.textContent = `Block ${i + 1}: ${start}-${end}`;
    blockSelect.appendChild(opt);
  }
}

function getSelectedBlock() {
  const blockIndex = Number(blockSelect.value) || 0;
  const start = blockIndex * 20;
  return PRELOADED_PHRASES.slice(start, start + 20).map((phrase, index) => ({
    ...phrase,
    globalIndex: start + index + 1,
    blockIndex: index + 1
  }));
}

function addRange(items, start, end) {
  const from = Math.max(1, start);
  const to = Math.min(items.length, end);
  const result = [];
  for (let i = from; i <= to; i += 1) result.push(i - 1);
  return result;
}

function buildReviewSchedule(items) {
  if (!items.length) return [];
  const order = [];
  const pushRange = (start, end) => order.push(...addRange(items, start, end));

  for (let end = 5; end <= Math.min(10, items.length); end += 1) {
    pushRange(Math.max(1, end - 5), end);
  }
  if (items.length >= 10) pushRange(1, 10);

  for (let end = 11; end <= Math.min(15, items.length); end += 1) {
    pushRange(Math.max(1, end - 5), end);
  }
  if (items.length >= 15) pushRange(6, 15);

  for (let end = 16; end <= items.length; end += 1) {
    pushRange(Math.max(1, end - 5), end);
  }
  if (items.length > 15) pushRange(11, items.length);
  if (items.length > 10) pushRange(1, Math.min(10, items.length));
  if (items.length > 10) pushRange(11, items.length);

  return order.map(phraseIndex => items[phraseIndex]);
}

function populateVoices() {
  voices = synth.getVoices().slice().sort((a, b) => (a.lang || "").localeCompare(b.lang || "") || (a.name || "").localeCompare(b.name || ""));
  updateVoiceSelect(deVoiceSel, "de");
  updateVoiceSelect(jaVoiceSel, "ja");
}

function updateVoiceSelect(select, langCode) {
  const prefs = langToBCP[langCode].map(value => value.toLowerCase());
  const list = voices.filter(voice => prefs.some(pref => (voice.lang || "").toLowerCase().startsWith(pref)));
  select.innerHTML = "";
  const autoOpt = document.createElement("option");
  autoOpt.value = "auto";
  autoOpt.textContent = list.length ? `Auto (${langCode})` : "Auto";
  select.appendChild(autoOpt);
  list.forEach(voice => {
    const opt = document.createElement("option");
    opt.value = `${voice.name}||${voice.lang}`;
    opt.textContent = `${voice.name} - ${voice.lang}`;
    select.appendChild(opt);
  });
  select.disabled = list.length === 0;
}

function findPreferredVoice(list, langCode) {
  const patterns = [...GENERAL_VOICE_PREFERENCE, ...(LANGUAGE_VOICE_PREFERENCE[langCode] || [])];
  for (const pattern of patterns) {
    const match = list.find(voice => pattern.test(voice.name || ""));
    if (match) return match;
  }
  return null;
}

function pickVoice(langCode) {
  const prefs = langToBCP[langCode].map(value => value.toLowerCase());
  const matches = voices.filter(voice => prefs.some(pref => (voice.lang || "").toLowerCase().startsWith(pref)));
  return findPreferredVoice(matches, langCode) || matches[0] || voices[0] || null;
}

function findVoice(select, langCode) {
  if (!select.value || select.value === "auto") return pickVoice(langCode);
  const [name, lang] = select.value.split("||");
  return voices.find(voice => voice.name === name && voice.lang === lang) || pickVoice(langCode);
}

function clearTimer() {
  if (timer) clearTimeout(timer);
  timer = null;
}

function cancelSpeech() {
  speechToken += 1;
  synth.cancel();
}

function speak(text, langCode, repeat, voiceSelect, rates = null) {
  const token = ++speechToken;
  const repeats = clampNumber(repeat, 1, 5, 1);
  const selectedVoice = findVoice(voiceSelect, langCode);
  return new Promise(resolve => {
    let left = repeats;
    const speakNext = () => {
      if (token !== speechToken || left <= 0) { resolve(); return; }
      const currentRepeatIndex = repeats - left;
      left -= 1;
      const cleanText = String(text || "").trim();
      if (!cleanText) { resolve(); return; }
      const utterance = new SpeechSynthesisUtterance(cleanText);
      utterance.lang = langToBCP[langCode][0];
      if (Array.isArray(rates) && rates[currentRepeatIndex]) utterance.rate = rates[currentRepeatIndex];
      if (selectedVoice) utterance.voice = selectedVoice;
      utterance.onend = () => left > 0 ? speakNext() : resolve();
      utterance.onerror = resolve;
      synth.speak(utterance);
    };
    speakNext();
  });
}

function currentPhrase() {
  return schedule[stepIndex] || null;
}

function render() {
  const phrase = currentPhrase();
  if (!phrase) {
    deTextEl.textContent = "No phrases loaded";
    jaTextEl.textContent = "";
    jaTextEl.classList.add("hidden");
    metaEl.textContent = "";
    return;
  }

  deTextEl.textContent = phrase.de;
  jaTextEl.textContent = phrase.ja;
  jaTextEl.classList.toggle("hidden", !showingJapanese);
  const blockNumber = (Number(blockSelect.value) || 0) + 1;
  metaEl.textContent = `Block ${blockNumber} phrase ${phrase.blockIndex}/${blockPhrases.length} - Global phrase ${phrase.globalIndex}/${PRELOADED_PHRASES.length} - Step ${stepIndex + 1}/${schedule.length}`;
}

function setControlsEnabled(enabled) {
  pauseBtn.disabled = !enabled;
  prevBtn.disabled = !enabled;
  nextBtn.disabled = !enabled;
  replayBtn.disabled = !enabled;
}

function scheduleAfter(seconds, callback) {
  clearTimer();
  timer = setTimeout(callback, seconds * 1000);
}

function playCurrentFromGerman() {
  const phrase = currentPhrase();
  if (!phrase) return;
  paused = false;
  showingJapanese = false;
  render();
  cancelSpeech();
  speak(phrase.de, "de", Number(deRepeatSel.value), deVoiceSel).then(() => {
    if (paused || !autoModeChk.checked) return;
    scheduleAfter(clampNumber(thinkDelayInput.value, 1, 30, 6), playJapanese);
  });
}

function playJapanese() {
  const phrase = currentPhrase();
  if (!phrase) return;
  showingJapanese = true;
  render();
  cancelSpeech();
  speak(phrase.ja, "ja", Number(jaRepeatSel.value), jaVoiceSel, [0.75, 0.85, 1]).then(() => {
    if (paused || !autoModeChk.checked) return;
    scheduleAfter(clampNumber(nextDelayInput.value, 1, 30, 3), nextStep);
  });
}

function nextStep() {
  if (!schedule.length) return;
  if (stepIndex >= schedule.length - 1) {
    paused = true;
    clearTimer();
    autoModeChk.checked = false;
    showingJapanese = true;
    render();
    return;
  }
  stepIndex += 1;
  playCurrentFromGerman();
}

function previousStep() {
  if (!schedule.length) return;
  stepIndex = Math.max(0, stepIndex - 1);
  playCurrentFromGerman();
}

function startSession() {
  clearTimer();
  cancelSpeech();
  blockPhrases = getSelectedBlock();
  schedule = buildReviewSchedule(blockPhrases);
  stepIndex = 0;
  showingJapanese = false;
  paused = false;
  setControlsEnabled(schedule.length > 0);
  if (autoModeChk.checked) playCurrentFromGerman();
  else render();
}

startBtn.addEventListener("click", startSession);
pauseBtn.addEventListener("click", () => {
  paused = true;
  clearTimer();
  cancelSpeech();
});
prevBtn.addEventListener("click", previousStep);
nextBtn.addEventListener("click", nextStep);
replayBtn.addEventListener("click", playCurrentFromGerman);
blockSelect.addEventListener("change", () => {
  clearTimer();
  cancelSpeech();
  blockPhrases = getSelectedBlock();
  schedule = buildReviewSchedule(blockPhrases);
  stepIndex = 0;
  showingJapanese = false;
  paused = true;
  setControlsEnabled(false);
  render();
});
autoModeChk.addEventListener("change", () => {
  clearTimer();
  if (autoModeChk.checked && schedule.length) playCurrentFromGerman();
});

if (typeof synth.onvoiceschanged !== "undefined") synth.onvoiceschanged = populateVoices;
populateBlocks();
populateVoices();
blockPhrases = getSelectedBlock();
schedule = buildReviewSchedule(blockPhrases);
render();
</script>
</body>
</html>
