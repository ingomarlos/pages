"Aufgabe 277: „Eine Frau, die ein zweijähriges Kind hat, bewirbt sich in Deutschland um eine Stelle. Was ist ein Beispiel für Diskriminierung? Sie bekommt die Stelle nur deshalb nicht, weil sie …“ Antwort: Mutter ist. Das bedeutet, dass eine Frau nicht schlechter behandelt werden darf, nur weil sie ein Kind hat. Wenn sie die Stelle nur wegen ihrer Mutterschaft nicht bekommt, ist das Diskriminierung.",

"Aufgabe 278: „Ein Mann im Rollstuhl hat sich auf eine Stelle als Buchhalter beworben. Was ist ein Beispiel für Diskriminierung? Er bekommt die Stelle nur deshalb nicht, weil er …“ Antwort: im Rollstuhl sitzt. Das bedeutet, dass ein Mensch nicht schlechter behandelt werden darf, nur weil er eine Behinderung hat. Wenn er die Arbeit machen kann, darf der Rollstuhl kein Grund für eine Ablehnung sein.",

"Aufgabe 279: „In den meisten Mietshäusern in Deutschland gibt es eine ‚Hausordnung‘. Was steht in einer solchen ‚Hausordnung‘?“ Antwort: Regeln, an die sich alle Bewohnerinnen und Bewohner halten müssen. Das bedeutet, dass in einer Hausordnung zum Beispiel Regeln zu Ruhezeiten, Müll, Treppenhaus oder gemeinsamer Nutzung stehen können.",

"Aufgabe 280: „Wenn Sie sich in Deutschland gegen einen falschen Steuerbescheid wehren wollen, müssen Sie …“ Antwort: Einspruch einlegen. Das bedeutet, dass man offiziell sagen kann, dass man mit dem Steuerbescheid nicht einverstanden ist. Man darf den Bescheid nicht einfach wegwerfen, sondern muss rechtzeitig Einspruch einlegen.",

"Aufgabe 281: „Zwei Freunde wollen in ein öffentliches Schwimmbad in Deutschland. Beide haben eine dunkle Hautfarbe und werden deshalb nicht hineingelassen. Welches Recht wird in dieser Situation verletzt?“ Antwort: das Recht auf Gleichbehandlung. Das bedeutet, dass Menschen nicht wegen ihrer Hautfarbe schlechter behandelt werden dürfen. Alle Menschen müssen fair und gleich behandelt werden.",

"Aufgabe 282: „Welches Ehrenamt müssen deutsche Staatsbürgerinnen und Staatsbürger übernehmen, wenn sie dazu aufgefordert werden?“ Antwort: Wahlhelferin/Wahlhelfer. Das bedeutet, dass deutsche Staatsbürgerinnen und Staatsbürger bei Wahlen helfen müssen, wenn sie dafür offiziell ausgewählt werden. Wahlhelferinnen und Wahlhelfer helfen zum Beispiel beim Ablauf der Wahl und beim Zählen der Stimmen.",

"Aufgabe 283: „Was tun Sie, wenn Sie eine falsche Rechnung von einer deutschen Behörde bekommen?“ Antwort: Ich lege Widerspruch bei der Behörde ein. Das bedeutet, dass man der Behörde offiziell mitteilt, dass die Rechnung falsch ist. Man soll die Rechnung nicht einfach liegen lassen oder wegwerfen.",

"Aufgabe 284: „Was man für die Arbeit können muss, ändert sich in Zukunft sehr schnell. Was kann man tun?“ Antwort: Erwachsene müssen auch nach der Ausbildung immer weiter lernen. Das bedeutet, dass Lernen nicht nach Schule oder Ausbildung endet. Im Beruf ändern sich Technik, Regeln und Aufgaben, deshalb ist Weiterbildung wichtig.",

"Aufgabe 285: „Frau Frost arbeitet als fest angestellte Mitarbeiterin in einem Büro. Was muss sie nicht von ihrem Gehalt bezahlen?“ Antwort: Umsatzsteuer. Das bedeutet, dass Angestellte von ihrem Gehalt zum Beispiel Lohnsteuer und Sozialversicherungsbeiträge zahlen. Umsatzsteuer zahlt man aber normalerweise beim Kauf von Waren und Dienstleistungen, nicht direkt vom Gehalt.",

"Aufgabe 286: „Welche Organisation in einer Firma hilft den Arbeitnehmerinnen und Arbeitnehmern bei Problemen mit der Arbeitgeberin/dem Arbeitgeber?“ Antwort: der Betriebsrat. Das bedeutet, dass der Betriebsrat die Interessen der Beschäftigten in einer Firma vertritt. Er kann helfen, wenn es Probleme mit der Arbeitgeberin oder dem Arbeitgeber gibt.",

"Aufgabe 287: „Sie möchten bei einer Firma in Deutschland Ihr Arbeitsverhältnis beenden. Was müssen Sie beachten?“ Antwort: die Kündigungsfrist. Das bedeutet, dass man nicht immer sofort mit der Arbeit aufhören kann. Im Arbeitsvertrag oder im Gesetz steht oft, wie lange vorher man kündigen muss.",

"Aufgabe 289: „Ein Mann mit dunkler Hautfarbe bewirbt sich um eine Stelle als Kellner in einem Restaurant in Deutschland. Was ist ein Beispiel für Diskriminierung? Er bekommt die Stelle nur deshalb nicht, weil …“ Antwort: er eine dunkle Haut hat. Das bedeutet, dass ein Mensch nicht wegen seiner Hautfarbe schlechter behandelt werden darf. Wenn er nur deshalb die Stelle nicht bekommt, ist das Diskriminierung.",

"Aufgabe 290: „Sie haben in Deutschland einen Fernseher gekauft. Zu Hause packen Sie den Fernseher aus, doch er funktioniert nicht. Der Fernseher ist kaputt. Was können Sie machen?“ Antwort: den Fernseher reklamieren. Das bedeutet, dass man dem Geschäft sagen kann, dass das Gerät kaputt ist. Dann kann man zum Beispiel Reparatur, Ersatz oder eine andere Lösung verlangen.",

"Aufgabe 291: „Warum muss man in Deutschland bei der Steuererklärung aufschreiben, ob man zu einer Kirche gehört oder nicht?“ Antwort: weil es eine Kirchensteuer gibt, die an die Einkommen- und Lohnsteuer geknüpft ist. Das bedeutet, dass manche Kirchenmitglieder Kirchensteuer zahlen. Deshalb ist diese Information für die Steuer wichtig.",

"Aufgabe 292: „Die Menschen in Deutschland leben nach dem Grundsatz der religiösen Toleranz. Was bedeutet das?“ Antwort: Jeder kann glauben, was er möchte. Das bedeutet, dass Menschen in Deutschland frei entscheiden dürfen, welche Religion sie haben oder ob sie keine Religion haben. Der Staat schreibt keine Religion vor.",

"Aufgabe 293: „Was ist in Deutschland ein Brauch zu Ostern?“ Antwort: Eier bemalen. Das bedeutet, dass viele Menschen zu Ostern Eier färben oder bemalen. Das ist ein bekannter Osterbrauch in Deutschland.",

"Aufgabe 294: „Pfingsten ist ein …“ Antwort: christlicher Feiertag. Das bedeutet, dass Pfingsten aus der christlichen Tradition kommt. Es ist in Deutschland ein Feiertag mit religiöser Bedeutung.",

"Aufgabe 295: „Welche Religion hat die europäische und deutsche Kultur geprägt?“ Antwort: das Christentum. Das bedeutet, dass viele Traditionen, Feiertage, Kirchen und Werte in Europa und Deutschland historisch stark vom Christentum beeinflusst wurden.",

"Aufgabe 296: „In Deutschland nennt man die letzten vier Wochen vor Weihnachten …“ Antwort: die Adventszeit. Das bedeutet, dass die Wochen vor Weihnachten Advent heißen. Viele Menschen zünden dann Adventskerzen an oder benutzen einen Adventskalender.",

"Aufgabe 297: „Aus welchem Land sind die meisten Migrantinnen und Migranten nach Deutschland gekommen?“ Antwort: Türkei. Das bedeutet, dass viele Menschen mit Migrationsgeschichte in Deutschland türkische Wurzeln haben.",

"Aufgabe 298: „In der DDR lebten vor allem Migrantinnen und Migranten aus …“ Antwort: Vietnam, Polen, Mosambik. Das bedeutet, dass viele ausländische Arbeitskräfte und Migrantinnen und Migranten in der DDR aus diesen Ländern kamen.",

"Aufgabe 299: „Ausländische Arbeitnehmerinnen und Arbeitnehmer, die in den 50er und 60er Jahren von der Bundesrepublik Deutschland angeworben wurden, nannte man …“ Antwort: Gastarbeiterinnen/Gastarbeiter. Das bedeutet, dass Deutschland damals Arbeitskräfte aus anderen Ländern angeworben hat. Diese Menschen wurden Gastarbeiterinnen und Gastarbeiter genannt.",

"Aufgabe 300: „Aus welchem Land kamen die ersten Gastarbeiterinnen und Gastarbeiter in die Bundesrepublik Deutschland?“ Antwort: Italien. Das bedeutet, dass die ersten angeworbenen Gastarbeiterinnen und Gastarbeiter in die Bundesrepublik Deutschland aus Italien kamen.",

"Aufgabe 1: „Welches Wappen gehört zum Freistaat Bayern?“ Antwort: Bild 2. Das bedeutet, dass man bei dieser Frage das Bild mit dem bayerischen Wappen wählen muss. Das bayerische Wappen erkennt man oft an den weiß-blauen Rauten und an anderen Symbolen für Bayern.",

"Aufgabe 2: „Welches ist ein Landkreis in Bayern?“ Antwort: Altötting. Das bedeutet, dass Altötting ein Landkreis in Bayern ist. Die anderen Orte gehören nicht als Landkreis zu Bayern.",

"Aufgabe 3: „Für wie viele Jahre wird der Landtag in Bayern gewählt?“ Antwort: 5. Das bedeutet, dass die Bürgerinnen und Bürger in Bayern den Landtag für fünf Jahre wählen. Danach gibt es wieder eine Landtagswahl.",

"Aufgabe 4: „Ab welchem Alter darf man in Bayern bei Kommunalwahlen wählen?“ Antwort: 18. Das bedeutet, dass man in Bayern bei Kommunalwahlen ab 18 Jahren wählen darf.",

"Aufgabe 5: „Welche Farben hat die Landesflagge von Bayern?“ Antwort: weiß-blau. Das bedeutet, dass die bayerische Landesflagge die Farben Weiß und Blau hat. Diese Farben sieht man auch oft bei bayerischen Symbolen.",

"Aufgabe 6: „Wo können Sie sich in Bayern über politische Themen informieren?“ Antwort: bei der Landeszentrale für politische Bildung. Das bedeutet, dass diese Stelle Informationen über Politik, Demokratie und Gesellschaft anbietet. Dort kann man politische Bildung bekommen.",

"Aufgabe 7: „Die Landeshauptstadt von Bayern heißt …“ Antwort: München. Das bedeutet, dass München die Hauptstadt des Bundeslandes Bayern ist. Dort sitzt auch die bayerische Landesregierung.",

"Aufgabe 8: „Welches Bundesland ist Bayern?“ Antwort: Bild 4. Das bedeutet, dass man auf der Karte das Bild wählen muss, das Bayern zeigt. Bayern liegt im Südosten von Deutschland.",

function clampNumber(value, min, max, fallback) {
  const parsed = Number(value);
  if (!Number.isFinite(parsed)) return fallback;
  return Math.min(max, Math.max(min, parsed));
}

function escapeHtml(value) {
  return String(value || "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/\x27/g, "&#39;");
}

function splitCardText(text) {
  const marker = "Antwort:";
  const index = String(text || "").indexOf(marker);
  if (index === -1) return { front: String(text || "").trim(), back: "" };
  return {
    front: text.slice(0, index).trim(),
    back: text.slice(index).trim()
  };
}

function formatBack(text) {
  return escapeHtml(text).replace(/^Antwort:/, '<span class="answer-marker">Antwort:</span>');
}

function updateAnswerSize() {
  const size = clampNumber(answerSizeInput.value, 18, 48, 24);
  answerSizeInput.value = String(size);
  answerSizeValue.textContent = String(size);
  document.documentElement.style.setProperty("--answer-size", size + "px");
}

function getBlockSize() {
  return clampNumber(blockSizeSel.value, 20, 100, 20);
}

function populateBlocks() {
  const previousValue = blockSelect.value;
  const blockSize = getBlockSize();
  blockSelect.innerHTML = "";
  const blockCount = Math.ceil(PRELOADED_CARDS.length / blockSize);
  for (let i = 0; i < blockCount; i += 1) {
    const start = i * blockSize + 1;
    const end = Math.min((i + 1) * blockSize, PRELOADED_CARDS.length);
    const opt = document.createElement("option");
    opt.value = String(i);
    opt.textContent = `Block ${i + 1}: ${start}-${end}`;
    blockSelect.appendChild(opt);
  }
  if ([...blockSelect.options].some(option => option.value === previousValue)) {
    blockSelect.value = previousValue;
  }
}

function shuffleCards(items) {
  const copy = items.slice();
  for (let i = copy.length - 1; i > 0; i -= 1) {
    const j = Math.floor(Math.random() * (i + 1));
    [copy[i], copy[j]] = [copy[j], copy[i]];
  }
  return copy;
}

function getSelectedBlock() {
  const blockSize = getBlockSize();
  const blockIndex = Number(blockSelect.value) || 0;
  const start = blockIndex * blockSize;
  const selected = PRELOADED_CARDS.slice(start, start + blockSize).map((text, index) => ({
    ...splitCardText(text),
    fullText: text,
    globalIndex: start + index + 1,
    originalBlockIndex: index + 1
  }));
  const ordered = shuffleBlockChk.checked ? shuffleCards(selected) : selected;
  return ordered.map((card, index) => ({ ...card, blockIndex: index + 1 }));
}

function addRange(items, start, end) {
  const from = Math.max(1, start);
  const to = Math.min(items.length, end);
  const result = [];
  for (let i = from; i <= to; i += 1) result.push(i - 1);
  return result;
}

function buildIntensiveSchedule(items) {
  if (!items.length) return [];
  const order = [];
  const pushRange = (start, end) => order.push(...addRange(items, start, end));

  for (let end = 5; end <= Math.min(10, items.length); end += 1) pushRange(Math.max(1, end - 5), end);
  if (items.length >= 10) pushRange(1, 10);
  for (let end = 11; end <= Math.min(15, items.length); end += 1) pushRange(Math.max(1, end - 5), end);
  if (items.length >= 15) pushRange(6, 15);
  for (let end = 16; end <= items.length; end += 1) pushRange(Math.max(1, end - 5), end);
  if (items.length > 15) pushRange(11, items.length);
  if (items.length > 10) pushRange(1, Math.min(10, items.length));
  if (items.length > 10) pushRange(11, items.length);

  return order.map(cardIndex => items[cardIndex]);
}

function buildReminderSchedule(items) {
  if (!items.length) return [];
  const order = [];
  const pushRange = (start, end) => order.push(...addRange(items, start, end));

  for (let start = 1; start <= items.length; start += 20) {
    const end = Math.min(start + 19, items.length);
    const firstMid = Math.min(start + 4, end);
    const firstEnd = Math.min(start + 9, end);
    const secondMid = Math.min(start + 14, end);
    pushRange(start, firstMid);
    if (firstMid < end) pushRange(firstMid + 1, firstEnd);
    if (firstEnd > start) pushRange(start, firstEnd);
    if (firstEnd < end) pushRange(firstEnd + 1, secondMid);
    if (secondMid < end) pushRange(secondMid + 1, end);
    if (firstEnd < end) pushRange(firstEnd + 1, end);
    pushRange(start, end);
  }

  return order.map(cardIndex => items[cardIndex]);
}

function buildLightSchedule(items) {
  if (!items.length) return [];
  const order = [];
  const pushRange = (start, end) => order.push(...addRange(items, start, end));

  for (let start = 1; start <= items.length; start += 20) {
    const end = Math.min(start + 19, items.length);
    const mid = Math.min(start + 9, end);
    pushRange(start, end);
    pushRange(start, mid);
    if (mid < end) pushRange(mid + 1, end);
  }

  return order.map(cardIndex => items[cardIndex]);
}

function buildReviewSchedule(items) {
  if (scheduleModeSel.value === "light") return buildLightSchedule(items);
  if (scheduleModeSel.value === "reminder") return buildReminderSchedule(items);
  return buildIntensiveSchedule(items);
}

function populateVoices() {
  voices = synth.getVoices().slice().sort((a, b) => (a.lang || "").localeCompare(b.lang || "") || (a.name || "").localeCompare(b.name || ""));
  updateVoiceSelect();
}

function updateVoiceSelect() {
  const list = voices.filter(voice => (voice.lang || "").toLowerCase().startsWith("de"));
  voiceSelect.innerHTML = "";
  const autoOpt = document.createElement("option");
  autoOpt.value = "auto";
  autoOpt.textContent = list.length ? "Auto (de)" : "Auto";
  voiceSelect.appendChild(autoOpt);
  list.forEach(voice => {
    const opt = document.createElement("option");
    opt.value = `${voice.name}||${voice.lang}`;
    opt.textContent = `${voice.name} - ${voice.lang}`;
    voiceSelect.appendChild(opt);
  });
  voiceSelect.disabled = list.length === 0;
}

function pickVoice() {
  const matches = voices.filter(voice => (voice.lang || "").toLowerCase().startsWith("de"));
  for (const pattern of VOICE_PREFERENCE) {
    const match = matches.find(voice => pattern.test(voice.name || ""));
    if (match) return match;
  }
  return matches[0] || voices[0] || null;
}

function findVoice() {
  if (!voiceSelect.value || voiceSelect.value === "auto") return pickVoice();
  const [name, lang] = voiceSelect.value.split("||");
  return voices.find(voice => voice.name === name && voice.lang === lang) || pickVoice();
}

function clearTimer() {
  if (timer) clearTimeout(timer);
  timer = null;
}

function cancelSpeech() {
  speechToken += 1;
  synth.cancel();
}

function speak(text, repeat) {
  const token = ++speechToken;
  const repeats = clampNumber(repeat, 1, 5, 1);
  const selectedVoice = findVoice();
  return new Promise(resolve => {
    let left = repeats;
    const speakNext = () => {
      if (token !== speechToken || left <= 0) { resolve(); return; }
      left -= 1;
      const cleanText = String(text || "").trim();
      if (!cleanText) { resolve(); return; }
      const utterance = new SpeechSynthesisUtterance(cleanText);
      utterance.lang = langToBCP.de[0];
      if (selectedVoice) utterance.voice = selectedVoice;
      utterance.onend = () => left > 0 ? setTimeout(speakNext, REPEAT_GAP_MS) : resolve();
      utterance.onerror = resolve;
      synth.speak(utterance);
    };
    speakNext();
  });
}

function currentCard() {
  return schedule[stepIndex] || null;
}

function render() {
  const card = currentCard();
  if (!card) {
    frontTextEl.textContent = "No cards loaded";
    backTextEl.textContent = "";
    backTextEl.classList.add("hidden");
    metaEl.textContent = "";
    return;
  }

  frontTextEl.textContent = card.front;
  backTextEl.innerHTML = formatBack(card.back);
  backTextEl.classList.toggle("hidden", !showingBack);
  const blockNumber = (Number(blockSelect.value) || 0) + 1;
  metaEl.textContent = `Block ${blockNumber} card ${card.blockIndex}/${blockCards.length} - Global card ${card.globalIndex}/${PRELOADED_CARDS.length} - Step ${stepIndex + 1}/${schedule.length}`;
}

function setControlsEnabled(enabled) {
  pauseBtn.disabled = !enabled;
  prevBtn.disabled = !enabled;
  nextBtn.disabled = !enabled;
  replayBtn.disabled = !enabled;
}

function scheduleAfter(seconds, callback) {
  clearTimer();
  timer = setTimeout(callback, seconds * 1000);
}

function playCurrentFromFront() {
  const card = currentCard();
  if (!card) return;
  paused = false;
  showingBack = false;
  render();
  cancelSpeech();
  speak(card.front, Number(frontRepeatSel.value)).then(() => {
    if (paused || !autoModeChk.checked) return;
    scheduleAfter(clampNumber(thinkDelayInput.value, 1, 30, 8), playBack);
  });
}

function playBack() {
  const card = currentCard();
  if (!card) return;
  showingBack = true;
  render();
  cancelSpeech();
  speak(card.back, Number(backRepeatSel.value)).then(() => {
    if (paused || !autoModeChk.checked) return;
    scheduleAfter(clampNumber(nextDelayInput.value, 1, 30, 5), nextStep);
  });
}

function nextStep() {
  if (!schedule.length) return;
  if (stepIndex >= schedule.length - 1) {
    const nextBlockIndex = (Number(blockSelect.value) || 0) + 1;
    if (nextBlockIndex < blockSelect.options.length) {
      blockSelect.value = String(nextBlockIndex);
      blockCards = getSelectedBlock();
      schedule = buildReviewSchedule(blockCards);
      stepIndex = 0;
      showingBack = false;
      paused = false;
      setControlsEnabled(schedule.length > 0);
      playCurrentFromFront();
      return;
    }
    paused = true;
    clearTimer();
    autoModeChk.checked = false;
    showingBack = true;
    render();
    return;
  }
  stepIndex += 1;
  playCurrentFromFront();
}

function previousStep() {
  if (!schedule.length) return;
  stepIndex = Math.max(0, stepIndex - 1);
  playCurrentFromFront();
}

function resetPreparedSession() {
  clearTimer();
  cancelSpeech();
  blockCards = getSelectedBlock();
  schedule = buildReviewSchedule(blockCards);
  stepIndex = 0;
  showingBack = false;
  paused = true;
  setControlsEnabled(false);
  render();
}

function startSession() {
  clearTimer();
  cancelSpeech();
  blockCards = getSelectedBlock();
  schedule = buildReviewSchedule(blockCards);
  stepIndex = 0;
  showingBack = false;
  paused = false;
  setControlsEnabled(schedule.length > 0);
  if (autoModeChk.checked) playCurrentFromFront();
  else render();
}

startBtn.addEventListener("click", startSession);
pauseBtn.addEventListener("click", () => {
  paused = true;
  clearTimer();
  cancelSpeech();
});
prevBtn.addEventListener("click", previousStep);
nextBtn.addEventListener("click", nextStep);
replayBtn.addEventListener("click", playCurrentFromFront);
blockSelect.addEventListener("change", resetPreparedSession);
scheduleModeSel.addEventListener("change", resetPreparedSession);
shuffleBlockChk.addEventListener("change", resetPreparedSession);
blockSizeSel.addEventListener("change", () => {
  populateBlocks();
  resetPreparedSession();
});
autoModeChk.addEventListener("change", () => {
  clearTimer();
  if (autoModeChk.checked && schedule.length) playCurrentFromFront();
});
answerSizeInput.addEventListener("input", updateAnswerSize);

if (typeof synth.onvoiceschanged !== "undefined") synth.onvoiceschanged = populateVoices;
populateBlocks();
populateVoices();
updateAnswerSize();
blockCards = getSelectedBlock();
schedule = buildReviewSchedule(blockCards);
render();
</script>
</body>
</html>
